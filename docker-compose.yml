services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gemma-custom-api
    volumes:
      - C:\models:/models
    environment:
      - MODEL_PATH=/models/google_gemma-4-E2B-it-Q4_K_M.gguf
      - MODEL_THREADS=4
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-httpx
    env_file:
      - .env
    ports:
      - "8502:8502"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure